name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *' # every six hours, so that the activity card and its repository count below follow the account
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # the date of the latest change of the method report (scripts/sync-method-report.mjs)
      # Link previews: a screenshot of every built page, then a second build that carries them (scripts/og-images.mjs).
      # If this step fails, the build above is deployed and every page uses the home page picture kept in the repository.
      - name: Draw the link previews
        continue-on-error: true
        run: |
          node scripts/og-images.mjs
          npm run build
        env:
          CHROME_PATH: /usr/bin/google-chrome
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The activity card for the profile README: the same card as on the Dev page, drawn as a static image.
      - uses: actions/checkout@v4
        with:
          repository: mohamedtalaat-gif/gh-spectrum
          ref: 1.4.0
          path: .tools/gh-spectrum
      - run: node .tools/gh-spectrum/bin/gh-spectrum.js mohamedtalaat-gif --out-dir dist --show repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
